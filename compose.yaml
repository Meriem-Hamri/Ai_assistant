services:
  postgres:
    image: postgres:18
    container_name: assistantai-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  chroma:
    image: chromadb/chroma:1.5.9
    container_name: assistantai-chroma

    ports:
      - "8001:8000"

    volumes:
      - chroma_data:/data

    restart: unless-stopped

  redis:
    image: redis:8
    container_name: assistantai-redis

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  worker:
    build:
      context: ./Backend
      dockerfile: Dockerfile.worker
    container_name: assistantai-worker

    command:
      - celery
      - -A
      - app.celery_app.celery_app
      - worker
      - --loglevel=INFO
      - --concurrency=1

    environment:
      REDIS_URL: redis://redis:6379/0

    volumes:
      - ./Backend/documents:/app/documents

    depends_on:
      redis:
        condition: service_healthy

    restart: unless-stopped


volumes:
  postgres_data:
  chroma_data:
